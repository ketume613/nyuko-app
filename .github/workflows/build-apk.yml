
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/jp/nyuko/notification
          mkdir -p android/app/src/main/assets

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'NyukoNotification'
          include ':app'
          EOF

          printf 'android.useAndroidX=true\n' > android/gradle.properties

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.16.0')
              implementation 'com.google.firebase:firebase-messaging'
          }

          android {
              namespace 'jp.nyuko.notification'
              compileSdk 35

              defaultConfig {
                  applicationId 'jp.nyuko.notification'
                  minSdk 26
                  targetSdk 35
                  versionCode 6
                  versionName '1.5'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:name=".ArrivalApplication"
                  android:label="入庫通知"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <service android:name=".ArrivalNotificationListener" android:label="入庫通知の検知" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="false">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
                  <service android:name=".ArrivalMessagingService" android:exported="false">
                      <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter>
                  </service>
                  <activity android:name=".LockScreenAlertActivity" android:exported="false" android:showWhenLocked="true" android:turnScreenOn="true" android:excludeFromRecents="true"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/jp/nyuko/notification/MainActivity.java <<'EOF'
          package jp.nyuko.notification;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import com.google.firebase.FirebaseApp;
          import com.google.firebase.FirebaseOptions;
          import com.google.firebase.messaging.FirebaseMessaging;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;

          public class MainActivity extends Activity {
              private WebView webView;
              private String subscribedTopic = "";

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != getPackageManager().PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 100);
                  }
                  if (!android.provider.Settings.canDrawOverlays(this)) {
                      android.content.Intent overlay = new android.content.Intent(android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION, android.net.Uri.parse("package:" + getPackageName()));
                      startActivity(overlay);
                  } else if (!!String.valueOf(android.provider.Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners")).contains(getPackageName())) {
                      startActivity(new android.content.Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  }
                  webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setReceiverRoom(String room) {
                          if (room == null || !room.matches("[a-zA-Z0-9_-]{12,80}")) return;
                          try {
                              byte[] hash = MessageDigest.getInstance("SHA-256").digest(room.getBytes(StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder("arrival_");
                              for (byte b : hash) sb.append(String.format("%02x", b & 0xff));
                              String next = sb.toString();
                              String old = getPreferences(0).getString("topic", "");
                              if (!old.isEmpty() && !old.equals(next)) FirebaseMessaging.getInstance().unsubscribeFromTopic(old);
                              FirebaseMessaging.getInstance().subscribeToTopic(next);
                              getPreferences(0).edit().putString("topic", next).apply();
                          } catch (Exception e) { android.util.Log.e("Arrival", "Topic error", e); }
                      }
                      @JavascriptInterface
                      public void disableReceiver() {
                          String old = getPreferences(0).getString("topic", "");
                          if (!old.isEmpty()) FirebaseMessaging.getInstance().unsubscribeFromTopic(old);
                          getPreferences(0).edit().remove("topic").apply();
                      }
                  }, "AndroidArrival");
                  android.widget.LinearLayout root = new android.widget.LinearLayout(this);
                  root.setOrientation(1);
                  android.widget.TextView diagnostic = new android.widget.TextView(this);
                  diagnostic.setPadding(20,16,20,12);
                  root.addView(diagnostic);
                  android.widget.Button test = new android.widget.Button(this);
                  test.setText("全画面テスト");
                  root.addView(test);
                  test.setOnClickListener(v -> {
                      if (android.provider.Settings.canDrawOverlays(this)) OverlayTester.show(this);
                      else startActivity(new android.content.Intent(android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION, android.net.Uri.parse("package:" + getPackageName())));
                  });
                  android.widget.Button refresh = new android.widget.Button(this);
                  refresh.setText("診断情報を更新");
                  root.addView(refresh);
                  Runnable update = () -> {
                      boolean overlay = android.provider.Settings.canDrawOverlays(this);
                      boolean listener = String.valueOf(android.provider.Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners")).contains(getPackageName());
                      String seen = getSharedPreferences("arrival_diagnostics",0).getString("last_ntfy","未検知");
                      diagnostic.setText("重ねて表示: " + (overlay ? "許可" : "未許可") + " / 通知アクセス: " + (listener ? "許可" : "未許可") + " / ntfy: " + seen);
                  };
                  refresh.setOnClickListener(v -> update.run());
                  update.run();
                  root.addView(webView,new android.widget.LinearLayout.LayoutParams(-1,0,1));
                  setContentView(root);
                  webView.loadUrl("https://ketume613.github.io/nyuko-app/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

