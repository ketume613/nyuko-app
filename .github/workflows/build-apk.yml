          cat > android/app/src/main/java/jp/nyuko/notification/ArrivalMessagingService.java <<'EOF'
          package jp.nyuko.notification;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          public class ArrivalMessagingService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(RemoteMessage message) {
                  NotificationManager manager = getSystemService(NotificationManager.class);
                  String channelId = "arrival_alerts_loud_v2";
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(channelId, "入庫通知", NotificationManager.IMPORTANCE_HIGH);
                      channel.enableVibration(true);
                      channel.setVibrationPattern(new long[]{0, 500, 200, 500, 200, 800});
                      channel.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI, new android.media.AudioAttributes.Builder().setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION).build());
                      manager.createNotificationChannel(channel);
                  }
                  Intent intent = new Intent(this, MainActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pending = PendingIntent.getActivity(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  android.app.Notification notification = new android.app.Notification.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.stat_notify_more)
                      .setContentTitle("📦 入庫しました")
                      .setContentText("入庫通知を確認してください")
                      .setAutoCancel(true)
                      .setContentIntent(pending)
                      .setCategory(android.app.Notification.CATEGORY_MESSAGE)
                      .build();
                  manager.notify((int)(System.currentTimeMillis() % Integer.MAX_VALUE), notification);
              }
          }
          EOF

          cat > android/app/src/main/java/jp/nyuko/notification/ArrivalNotificationListener.java <<'EOF'
          package jp.nyuko.notification;

          import android.app.Notification;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class ArrivalNotificationListener extends NotificationListenerService {
              private static final String TOPIC = "nyuko-acfa47fc4a1f8d6dc2ddb2c0dae4c9fa7ea48bad4c239313";
              private final Handler handler = new Handler(Looper.getMainLooper());
              private View currentOverlay;
              private WindowManager windowManager;

              @Override public void onNotificationPosted(StatusBarNotification sbn) {
                  if (!"io.heckel.ntfy".equals(sbn.getPackageName())) return;
                  getSharedPreferences("arrival_diagnostics",0).edit().putString("last_ntfy","ntfy検知 " + System.currentTimeMillis()).apply();
                  Notification n = sbn.getNotification();
                  if (n == null || n.extras == null) return;
                  String title = String.valueOf(n.extras.getCharSequence(Notification.EXTRA_TITLE, ""));
                  String text = String.valueOf(n.extras.getCharSequence(Notification.EXTRA_TEXT, ""));
                  String bigText = String.valueOf(n.extras.getCharSequence(Notification.EXTRA_BIG_TEXT, ""));
                  // ntfy can replace the long topic with a user-defined display name.
                  // Match the exact arrival phrase from ntfy, regardless of notification title.
                  if (!(text.contains("入庫しました") || bigText.contains("入庫しました") || title.contains("入庫しました"))) return;
                  android.util.Log.i("Arrival", "ntfy arrival detected: " + title + " / " + text);
                  getSharedPreferences("arrival_diagnostics",0).edit().putString("last_ntfy","入庫検知 " + System.currentTimeMillis()).apply();
                  handler.post(() -> {
                      android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && pm.isInteractive()) OverlayTester.show(this);
                      else LockScreenAlertActivity.notifyFullScreen(this);
                  });
              }

              private void showOverlay() {
                  if (!Settings.canDrawOverlays(this)) return;
                  if (windowManager == null) windowManager = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  if (currentOverlay != null) {
                      try { windowManager.removeView(currentOverlay); } catch (Exception ignored) {}
                      currentOverlay = null;
                  }
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(32, 32, 32, 32);
                  layout.setBackgroundColor(Color.rgb(7, 121, 63));
                  TextView title = new TextView(this);
                  title.setText("📦 入庫しました！");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(38);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);
                  Button dismiss = new Button(this);
                  dismiss.setText("確認しました");
                  dismiss.setTextSize(22);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.topMargin = 80;
                  layout.addView(dismiss, p);
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT);
                  currentOverlay = layout;
                  dismiss.setOnClickListener(v -> {
                      if (currentOverlay == layout) {
                          try { windowManager.removeView(layout); } catch (Exception ignored) {}
                          currentOverlay = null;
                      }
                  });
                  try { windowManager.addView(layout, params); }
                  catch (Exception e) { android.util.Log.e("Arrival", "Overlay blocked", e); currentOverlay = null; }
              }
              @Override public void onDestroy() {
                  handler.post(() -> {
                      if (currentOverlay != null && windowManager != null) {
                          try { windowManager.removeView(currentOverlay); } catch (Exception ignored) {}
                          currentOverlay = null;
                      }
                  });
                  super.onDestroy();
              }
          }
          EOF

          cat > android/app/src/main/java/jp/nyuko/notification/OverlayTester.java <<'EOF'
          package jp.nyuko.notification;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          public class OverlayTester {
              private static View active;
              public static void show(Context context) {
                  if (!Settings.canDrawOverlays(context)) return;
                  WindowManager wm = (WindowManager) context.getSystemService(Context.WINDOW_SERVICE);
                  if (active != null) { try { wm.removeView(active); } catch (Exception ignored) {} active = null; }
                  LinearLayout layout = new LinearLayout(context);
                  layout.setOrientation(1);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(28,28,28,28);
                  layout.setBackgroundColor(Color.rgb(7,121,63));
                  TextView title = new TextView(context);
                  title.setText("📦 入庫しました！");
                  title.setTextSize(38);
                  title.setTypeface(null,Typeface.BOLD);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);
                  Button close = new Button(context);
                  close.setText("確認しました");
                  close.setTextSize(22);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.topMargin = 70;
                  layout.addView(close,p);
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(-1,-1,WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,PixelFormat.TRANSLUCENT);
                  close.setOnClickListener(v -> { try { wm.removeView(layout); } catch (Exception ignored) {} if (active == layout) active = null; });
                  try { wm.addView(layout,params); active = layout; }
                  catch (Exception e) { android.util.Log.e("Arrival","Overlay blocked",e); }
              }
          }
          EOF

          cat > android/app/src/main/java/jp/nyuko/notification/LockScreenAlertActivity.java <<'EOF'
          package jp.nyuko.notification;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.AudioAttributes;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          public class LockScreenAlertActivity extends Activity {
              public static void notifyFullScreen(Context context) {
                  NotificationManager nm = context.getSystemService(NotificationManager.class);
                  String channel = "arrival_lock_screen_v1";
                  NotificationChannel c = new NotificationChannel(channel,"入庫通知・ロック画面",NotificationManager.IMPORTANCE_HIGH);
                  c.setDescription("スリープ中の入庫通知");
                  c.enableVibration(true);
                  c.setVibrationPattern(new long[]{0,600,250,600});
                  c.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
                      new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).build());
                  nm.createNotificationChannel(c);
                  Intent intent = new Intent(context,LockScreenAlertActivity.class);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(context,211,intent,PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(context,channel)
                      .setSmallIcon(android.R.drawable.stat_notify_more)
                      .setContentTitle("入庫しました！")
                      .setContentText("入庫通知を確認してください")
                      .setCategory(Notification.CATEGORY_ALARM)
                      .setPriority(Notification.PRIORITY_HIGH)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setFullScreenIntent(pi,true)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build();
                  nm.notify(211,n);
              }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(1);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(30,30,30,30);
                  root.setBackgroundColor(Color.rgb(7,121,63));
                  TextView label = new TextView(this);
                  label.setText("📦 入庫しました！");
                  label.setTextColor(Color.WHITE);
                  label.setTypeface(null,Typeface.BOLD);
                  label.setTextSize(38);
                  label.setGravity(Gravity.CENTER);
                  root.addView(label);
                  Button close = new Button(this);
                  close.setText("確認しました");
                  close.setTextSize(22);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.topMargin = 70;
                  root.addView(close,p);
                  close.setOnClickListener(v -> {
                      getSystemService(NotificationManager.class).cancel(211);
                      finish();
                  });
                  setContentView(root);
              }
          }
          EOF

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyuko-notification-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
