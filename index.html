<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1669b2">
<link rel="manifest" href="manifest.webmanifest">
<title>入庫通知</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5f8;color:#162432;margin:0}
main{max-width:520px;margin:0 auto;padding:32px 20px 48px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
h1{font-size:30px;margin:0 0 30px;text-align:center}
.panel{background:#fff;padding:28px 22px;border-radius:22px;box-shadow:0 4px 22px #0000000d}
button{width:100%;border:0;border-radius:17px;background:#176fc4;color:white;font-size:clamp(25px,7vw,35px);font-weight:800;min-height:160px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.6}
#status{min-height:54px;text-align:center;font-size:17px;line-height:1.6;margin:24px 0 0;overflow-wrap:anywhere}
.note{text-align:center;color:#657381;font-size:13px;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>📦 入庫通知</h1>
<div class="panel">
<button id="send" type="button">入庫しました</button>
<p id="status" role="status" aria-live="polite">通知の送信準備ができました</p>
</div>
<p class="note">ボタンを押すと登録済みの受信スマホに通知します</p>
</main>
<script type="module" src="./app.js?v=20261113-onebutton1"></script>
</body>
</html>
