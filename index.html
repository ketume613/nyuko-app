<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1669b2"><link rel="manifest" href="manifest.webmanifest"><title>入庫通知</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f2f5f8;color:#162432}main{max-width:540px;margin:auto;padding:24px}h1{font-size:25px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 3px 16px #0001;margin:18px 0}button{width:100%;border:0;border-radius:14px;padding:20px;font-size:22px;font-weight:700;background:#176fc4;color:white;margin:10px 0}button.secondary{background:#e8edf2;color:#263747}input{padding:15px;font-size:18px;width:100%;box-sizing:border-box;border:1px solid #bcc9d4;border-radius:10px}#notice{display:none;position:fixed;inset:0;background:#137c43;color:white;z-index:10;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}#notice strong{font-size:clamp(50px,13vw,100px)}#notice button{background:white;color:#137c43;max-width:400px}small{color:#657381}#notice small{color:white}</style></head><body><main><h1>📦 入庫通知</h1><div class="panel"><label for="room">共有コード（2台で同じ文字）</label><input id="room" placeholder="例：souko-12345" autocomplete="off"><p><small>共有コードを知る人は情報を閲覧・操作できます。推測されにくい文字列を使用してください。</small></p><button id="connect">接続する</button><p id="status" aria-live="polite">未接続</p></div><div class="panel" id="sender" hidden><h2>送信側</h2><button id="send">入庫しました</button><p id="sent"></p></div><div class="panel" id="receiver" hidden><h2>受信側</h2><p>接続中は入庫を受信すると画面いっぱいに表示します。</p><button class="secondary" id="test">画面表示テスト</button><p><small>このページを閉じたり、別アプリを使用している間の通知には対応していません。</small></p></div><div class="panel" id="modebox" hidden><h2>役割を選択</h2><button id="asSender">送信側として使う</button><button id="asReceiver" class="secondary">受信側として使う</button></div></main><div id="notice" role="alertdialog" aria-modal="true"><small id="time"></small><strong>入庫済み</strong><button id="ack">確認しました</button></div><script type="module" src="app.js"></script></body></html>
